[project]
name = "google-rss-mcp"
version = "0.2.0"
description = "MCP server for Google News: search headlines in any language and read article text."
authors = [{ name = "ccw7463" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "google-news", "rss", "news"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastmcp>=2.10.5",
    "aiohttp>=3.12.14",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.2",
    "certifi>=2024.2.2",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
# Only needed to run examples/langgraph_test.py, never by the server itself.
examples = [
    "langchain>=0.3.26",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=0.3.27",
    "langgraph>=0.5.2",
    "rich>=14.0.0",
]
dev = [
    "black>=25.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx2>=2.12.0",  # starlette.testclient transport
]

[project.scripts]
google-rss-mcp = "google_rss_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ccw7463/google-rss-mcp"
Repository = "https://github.com/ccw7463/google-rss-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_rss_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
